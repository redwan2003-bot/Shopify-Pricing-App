# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ff2a27051df6abf548cc227e021e97a4"
name = "ImprintID Dynamic Pricing"
application_url = "https://shopify-pricing-app.pdbd-primeit.workers.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  # Mandatory privacy webhooks for public apps: customer data request, customer erasure and
  # shop erasure. Handled in app/routes/webhooks.compliance.tsx.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[access_scopes]
scopes = "write_products,write_cart_transforms,write_validations,write_publications,read_orders"

[auth]
redirect_urls = [
  "https://shopify-pricing-app.pdbd-primeit.workers.dev/auth/callback",
  "https://shopify-pricing-app.pdbd-primeit.workers.dev/auth/shopify/callback"
]

[app_proxy]
url = "https://shopify-pricing-app.pdbd-primeit.workers.dev/apps/imprintid-pricing"
subpath = "imprintid-pricing"
prefix = "apps"
