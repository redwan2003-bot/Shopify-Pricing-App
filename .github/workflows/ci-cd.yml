name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------
  # Both Shopify Functions are Rust (the Cart Transform and the Validation Function). Check
  # formatting, run their tests and make sure each builds to a wasm module under Shopify's
  # 256 KB limit. Runs in parallel with the application tests.
  # ---------------------------------------------------------------------------------------
  rust-functions:
    name: Rust Function (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - imprintid-cart-pricing
          - imprintid-cart-validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust for Shopify Functions
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      # Writes the gitignored src/config.secret.generated.rs the crate includes. A pull request
      # from a fork has no secrets and uses the placeholder; the tests sign their own quotes, so
      # they never depend on the real value. Only the fingerprint is printed, never the secret.
      - name: Generate Function secret config
        run: node extensions/${{ matrix.crate }}/scripts/generate-config.mjs
        env:
          IMPRINTID_CART_SIGNING_SECRET: ${{ secrets.IMPRINTID_CART_SIGNING_SECRET || 'dev_signing_secret_for_ci_test_run' }}

      - name: Check formatting
        run: cargo fmt --check --manifest-path extensions/${{ matrix.crate }}/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path extensions/${{ matrix.crate }}/Cargo.toml

      - name: Build the Function (wasm, release)
        run: cargo build --manifest-path extensions/${{ matrix.crate }}/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Check the wasm stays under Shopify's 256 KB limit
        run: |
          wasm="extensions/${{ matrix.crate }}/target/wasm32-unknown-unknown/release/$(echo '${{ matrix.crate }}' | tr '-' '_').wasm"
          size=$(stat -c%s "$wasm")
          echo "$wasm: $size bytes"
          test "$size" -lt 262144

  # ---------------------------------------------------------------------------------------
  # Application tests and build, against the isolated Neon TEST branch (never production).
  # ---------------------------------------------------------------------------------------
  validate-and-test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time against the shared test branch.
    concurrency:
      group: neon-test-branch
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Function Secret Configs
        run: pnpm run fn:config
        env:
          IMPRINTID_CART_SIGNING_SECRET: ${{ secrets.IMPRINTID_CART_SIGNING_SECRET || 'dev_signing_secret_for_ci_test_run' }}

      # `pnpm test` loads .env.test with `node --env-file`, so the file must exist. It is built
      # from the TEST_DATABASE_URL secret (the Neon test branch). The job refuses to run if the
      # secret is missing or names the production endpoint, because the tests write data.
      - name: Create the test environment file
        run: |
          set -euo pipefail
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "::error title=Missing secret::TEST_DATABASE_URL is not set. Add the Neon TEST branch connection string under Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$TEST_DATABASE_URL" in
            *ep-lively-dust-b4axu1i2*)
              echo "::error title=Refusing the production database::TEST_DATABASE_URL points at the production endpoint."
              exit 1
              ;;
          esac
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$TEST_DATABASE_URL"
            printf 'DATABASE_URL_UNPOOLED=%s\n' "${TEST_DATABASE_URL_UNPOOLED:-$TEST_DATABASE_URL}"
            printf 'TEST_DATABASE_URL=%s\n' "$TEST_DATABASE_URL"
            printf 'NEON_BRANCH=test\n'
          } > .env.test
          node -e 'console.log("test database host:", new URL(process.env.TEST_DATABASE_URL).host)'
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # The Rust validation Function is tested against a corpus generated from the TypeScript
      # reference. Fail if the committed corpus no longer matches the reference.
      - name: Check the validation parity corpus is current
        run: |
          node extensions/imprintid-cart-validation/scripts/generate-parity-corpus.mjs
          git diff --exit-code -- extensions/imprintid-cart-validation/src/fixtures/parity-corpus.json

      - name: Run Full Test Suite
        run: pnpm test

      - name: Build Web Application
        run: pnpm run build

  deploy-shopify-app:
    name: Deploy Shopify Extensions & Config
    needs: [validate-and-test, rust-functions]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Setup Rust for Shopify Functions
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Function Secret Configs
        run: pnpm run fn:config
        env:
          IMPRINTID_CART_SIGNING_SECRET: ${{ secrets.IMPRINTID_CART_SIGNING_SECRET }}

      # The Worker and both Shopify Functions must share exactly one signing secret.
      # Refuse to publish when the Actions secret drifts from the reviewed production
      # fingerprint; only the non-secret SHA-256 prefix is logged.
      - name: Verify production signing-secret fingerprint
        run: node scripts/verify-signing-secret-fingerprint.mjs
        env:
          IMPRINTID_CART_SIGNING_SECRET: ${{ secrets.IMPRINTID_CART_SIGNING_SECRET }}
          IMPRINTID_CART_SIGNING_SECRET_FINGERPRINT: d23c73d4

      # Pinned to the version this project was validated with; a new major release changes
      # command behaviour.
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4.9.4

      - name: Validate Shopify production configuration
        run: shopify app config validate --config=production --json
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}

      - name: Deploy Extensions & Configuration
        run: shopify app deploy --config shopify.app.production.toml --allow-updates --message "CI/CD automated deployment [${{ github.sha }}]"
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_FLAG_STORE: imprintid-pricing-dev.myshopify.com
