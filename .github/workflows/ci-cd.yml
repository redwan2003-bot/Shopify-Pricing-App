name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Test & Build (904 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust for Shopify Functions
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dependencies
        run: npm ci

      - name: Generate Function Secret Configs
        run: npm run fn:config
        env:
          IMPRINTID_CART_SIGNING_SECRET: ${{ secrets.IMPRINTID_CART_SIGNING_SECRET || 'dev_signing_secret_for_ci_test_run' }}

      - name: Build native Cart Transform
        run: cargo build --manifest-path extensions/imprintid-cart-pricing/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Generate Prisma Client (SQLite & PostgreSQL)
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.postgresql.prisma

      - name: Check SQLite and PostgreSQL schemas match
        run: |
          diff <(sed -E '/^\s*(provider|url)\s*=/d' prisma/schema.prisma) \
               <(sed -E '/^\s*(provider|url)\s*=/d' prisma/schema.postgresql.prisma) \
            || { echo "::error::prisma/schema.prisma and schema.postgresql.prisma differ beyond the datasource block"; exit 1; }
        shell: bash

      # The PostgreSQL generate step above overwrites the SQLite client at the same default
      # output path (neither schema declares a custom `output`), so the test suite would
      # otherwise run against a Postgres-typed client with no postgresql:// DATABASE_URL.
      # Regenerate the SQLite client right before tests run so it's the one in effect.
      - name: Regenerate SQLite Prisma Client for tests
        run: npx prisma generate --schema=prisma/schema.prisma

      # A fresh CI checkout has no prisma/dev.sqlite and nothing has ever applied the SQLite
      # migration history to it, so every Prisma call fails with "table does not exist".
      - name: Apply SQLite migrations for tests
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      # A subset of tests (app/lib/pricing/lny01.test.ts and everything downstream of it) are
      # explicitly documented as calculating against the real seeded LNY01 profile, not a
      # fixture -- an empty-but-migrated database isn't enough for them.
      # The test suite's own SHOP_DOMAIN constants (app/lib/pricing/lny01.test.ts and its
      # downstream pricing-api tests) expect "imprintid-pricing-development.myshopify.com",
      # not prisma/seed.ts's own default -- point the seed at the domain the tests already use.
      - name: Seed the SQLite database for tests
        run: npm run db:seed
        env:
          SEED_SHOP_DOMAIN: imprintid-pricing-development.myshopify.com

      - name: Run Full Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

  deploy-shopify-app:
    name: Deploy Shopify Extensions & Config
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust for Shopify Functions
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dependencies
        run: npm ci

      - name: Generate Function Secret Configs
        run: npm run fn:config
        env:
          IMPRINTID_CART_SIGNING_SECRET: ${{ secrets.IMPRINTID_CART_SIGNING_SECRET }}

      # The Shopify CLI's JavaScript-Function build pipeline (GraphQL codegen, then javy)
      # unconditionally shells out to `pnpm exec`, regardless of the project's own package
      # manager -- confirmed by reproducing `spawn pnpm ENOENT` in a clean container with no
      # pnpm installed. Node 22 ships Corepack, so this needs no extra dependency.
      - name: Enable pnpm (required by the Shopify CLI's Function build pipeline)
        run: |
          corepack enable
          pnpm --version

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Validate Shopify production configuration
        run: shopify app config validate --config=production --json
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}

      - name: Deploy Extensions & Configuration
        run: shopify app deploy --config shopify.app.production.toml --allow-updates --message "CI/CD automated deployment [${{ github.sha }}]"
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_FLAG_STORE: imprintid-pricing-dev.myshopify.com

  build-docker-image:
    name: Build & Push Docker Image
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
