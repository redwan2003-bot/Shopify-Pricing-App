[package]
name = "imprintid_cart_pricing"
version = "1.0.0"
edition = "2021"

[dependencies]
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shopify_function = "2.1.0"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
