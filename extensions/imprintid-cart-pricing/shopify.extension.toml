api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "imprintid-cart-pricing"
type = "function"
uid = "e17f4c6a-9d02-41b7-8b3a-2c5f6e9a10d1"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart_transform_run"

  [extensions.build]
  # Task 5B.3B §Phase-2 — the gitignored src/config.secret.generated.rs (imported by
  # src/config.rs) MUST exist before this Function is bundled. It is written
  # by `node scripts/generate-config.mjs`, run automatically by the repo-root npm hooks
  # `pretest` / `pretypecheck` / `predev` / `predeploy` (see package.json `fn:config`).
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/imprintid_cart_pricing.wasm"
  watch = [ "src/**/*.rs" ]

  [extensions.ui.paths]
  create = "/"
  details = "/"
