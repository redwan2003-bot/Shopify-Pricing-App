api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "imprintid-cart-validation"
type = "function"
uid = "f6c40ee2-077e-ec69-1857-fc896b1265893588c64d"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/cart_validations_generate_run.graphql"
  export = "cart_validations_generate_run"

  [extensions.build]
  # The deployed Validation Function is Rust: the JavaScript version spent ~27M instructions
  # verifying one HMAC-SHA256 signature against Shopify's 11M limit. The TypeScript sources stay
  # in src/ as the readable reference and its tests, as in imprintid-cart-pricing.
  # The gitignored src/config.secret.generated.rs (imported by src/config.rs) MUST exist before
  # this Function is built. It is written by `node scripts/generate-config.mjs`, run by the
  # repo-root npm hooks `pretest` / `pretypecheck` / `predev` / `predeploy` (`fn:config`).
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/imprintid_cart_validation.wasm"
  watch = [ "src/**/*.rs" ]
